<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit layout</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --text: #1d1f23; --muted: #646a73;
  --line: #e2e4e8; --empty: #f0f1f3; --accent: #2457d6; --select: #d6392f;
  --code: #f4f5f7; --note: #fff7e0; --note-line: #f0d68a; --on-cell: #15171a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --text: #e6e8eb; --muted: #9aa1ab;
    --line: #2e3238; --empty: #24272c; --accent: #7aa2ff; --select: #ff7a6e;
    --code: #262a30; --note: #2d2717; --note-line: #6b5a24; --on-cell: #f4f5f7;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 36px 0 4px; scroll-margin-top: 12px; }
p.lead { color: var(--muted); margin: 0 0 16px; }
.note { background: var(--note); border: 1px solid var(--note-line); border-radius: 8px; padding: 8px 12px; margin: 0 0 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.card b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.card span { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.grid-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
canvas { display: block; cursor: crosshair; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
  display: none; max-width: 460px; z-index: 10; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
.bar .grow { flex: 1; }
button, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button.on { border-color: var(--accent); color: var(--accent); }
input[type=number] { width: 100px; }
input[type=search] { width: 260px; }
code, .eq, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.eq { background: var(--code); border-radius: 6px; padding: 8px 10px; margin: 4px 0 10px; overflow-wrap: anywhere; }
.label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.focus td { background: var(--code); }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
a:hover { text-decoration: underline; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
.legend { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
.chip { display: inline-block; border-left: 4px solid var(--line); background: var(--code); border-radius: 4px;
  padding: 0 6px; margin: 2px 4px 2px 0; cursor: pointer; white-space: nowrap; }
.chip .col { color: var(--muted); margin-right: 4px; }
.chip .val { color: var(--muted); margin-left: 4px; }
.chip.on { outline: 2px solid var(--select); }
.placed { margin: 2px 0; overflow-wrap: anywhere; }
#flow { width: 100%; overflow-x: auto; margin: 4px 0 12px; }
#flow svg { display: block; }
#flow text { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: var(--text); }
#flow .title { font: 600 11px system-ui, sans-serif; fill: var(--muted); letter-spacing: .04em; }
#flow .box { fill: var(--panel); stroke: var(--line); }
#flow .edge { fill: none; stroke: var(--muted); stroke-width: 1.2; }
#flow .head { fill: var(--muted); }
#flow a text { fill: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title">Circuit layout</h1>
  <p class="lead" id="lead"></p>
  <div id="notice"></div>
  <div class="cards" id="cards"></div>
  <div id="content"></div>
</main>
<div id="tip"></div>
<script id="data" type="application/json">/*DATA*/null</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = (x) => Number(x).toLocaleString("en-US");
const hasNames = Object.keys(D.names).length > 0;
const hasValues = Array.isArray(D.values);

// A wire's name: its Circom signal name when a symbol file was given, else
// its role from the R1CS header (outputs, public inputs, private inputs).
function wireName(w) {
  if (w === 0) return "1";
  if (D.names[w]) return D.names[w];
  if (D.kind === "packed" && w >= D.originalWires) return "aux" + w;
  const o = D.outputs, i = D.publicInputs, p = D.privateInputs;
  if (w <= o) return `out[${w - 1}]`;
  if (w <= o + i) return `pub[${w - 1 - o}]`;
  if (w <= o + i + p) return `in[${w - 1 - o - i}]`;
  return "w" + w;
}
// A linear combination, at most `max` terms. Coefficients beyond 2^53, and
// those written as powers of two, arrive as strings.
function lc(terms, name = wireName, max = 8) {
  if (!terms.length) return "0";
  const parts = terms.slice(0, max).map(([w, k], i) => {
    const neg = String(k).startsWith("-"), a = String(k).replace(/^-/, "");
    const body = w === 0 ? a : (a === "1" ? "" : a + "·") + name(w);
    return (i === 0 ? (neg ? "−" : "") : (neg ? " − " : " + ")) + body;
  });
  return parts.join("") + (terms.length > max ? ` + … (${terms.length - max} more)` : "");
}
const product = (a, b, name) => (a.length || b.length ? `(${lc(a, name)}) · (${lc(b, name)})` : "0");
const equation = ([a, b, c], name = wireName) => `${product(a, b, name)} = ${lc(c, name)}`;
const card = (value, label) => `<div class="card"><b>${value}</b><span>${label}</span></div>`;

$("title").textContent = `${D.source}: ${D.kind} artifact`;
$("lead").textContent = `Relation ${D.relation}. Drawn from the certificate${D.kind === "packed" ? " and map" : ""}`
  + `${hasValues ? " and the witness trace" : ""}, which "air check" verifies; this page does not check them.`;
if (!hasNames) {
  $("notice").innerHTML = `<div class="note"><b>No signal names.</b> An R1CS file has none, so wires are shown by role:
    <code>out[i]</code> outputs, <code>pub[i]</code> public inputs, <code>in[i]</code> private inputs, <code>wN</code> internal wires.
    For Circom names, compile with <code>circom --sym</code> and pass the <code>.sym</code> file with <code>--sym</code>,
    or put it next to the <code>.r1cs</code> file with the same name.</div>`;
}

if (D.kind === "packed") packed(); else columns();

// ------------------------------------------------------------ reference / module
function columns() {
  const column = (w) => (w === 0 ? "1" : `a[${D.wireColumns[w]}]`);
  const cards = [card(n(D.equations.length), "source equations"), card(n(D.wires - 1), "wires, one column each")];
  if (D.rows) cards.push(card(n(D.rows), "rows, one instance each"));
  cards.push(card(n(D.kind === "module" ? D.exports.length : D.outputs + D.publicInputs),
    D.kind === "module" ? "exported wires" : "public values, on row 0"));
  $("cards").innerHTML = cards.join("");
  const tag = (w) => {
    const p = D.publicWires.indexOf(w);
    if (p >= 0) return `public[${p}]`;
    return D.exports.includes(w) ? "exported" : "";
  };
  const rows = D.wireColumns.map((c, w) => (c === null ? "" :
    `<tr><td class="mono">a[${c}]</td><td><code>${esc(wireName(w))}</code></td><td>${w}</td><td>${tag(w)}</td></tr>`)).join("");
  $("content").innerHTML = `
    <h2 id="equations">Equations</h2>
    <p class="legend">Each source equation becomes one constraint <code>A·B − C = 0</code> over the columns,
      enforced on every row${D.kind === "module" ? " of the host" : ""}.</p>
    <div class="bar"><button id="prev">←</button><input type="number" id="pick" min="0" max="${D.equations.length - 1}" value="0"><button id="next">→</button><span class="legend" id="count"></span></div>
    <div class="label">Over signals</div><div class="eq" id="eqw"></div>
    <div class="label">Over columns</div><div class="eq" id="eqc"></div>
    <h2 id="columns">Columns</h2>
    <p class="legend">Every row holds a whole assignment: wire <i>w</i> in column <code>a[w − 1]</code>; the constant 1 needs no column.</p>
    <div class="panel" style="max-height:60vh;overflow:auto;padding:0"><table>
      <tr><th>Column</th><th>Signal</th><th>Wire</th><th></th></tr>${rows}</table></div>`;
  const show = (i) => {
    i = Math.max(0, Math.min(D.equations.length - 1, i | 0));
    $("pick").value = i;
    $("count").textContent = `of ${n(D.equations.length)}`;
    $("eqw").textContent = equation(D.equations[i]);
    $("eqc").textContent = equation(D.equations[i], column);
  };
  $("prev").onclick = () => show(+$("pick").value - 1);
  $("next").onclick = () => show(+$("pick").value + 1);
  $("pick").onchange = () => show(+$("pick").value);
  show(0);
}

// -------------------------------------------------------------------- packed
function packed() {
  const W = D.width, R = D.rows, nAux = D.auxiliaries.length;
  const cellsOf = new Map();
  D.cells.forEach((w, cell) => { if (w) { if (!cellsOf.has(w)) cellsOf.set(w, []); cellsOf.get(w).push(cell); } });
  const copied = [...cellsOf.values()].filter((c) => c.length > 1).length;
  const used = D.cells.filter((w) => w).length;
  const byRow = new Map(), byIndex = new Map();
  D.placements.forEach((p) => {
    if (!byRow.has(p[2])) byRow.set(p[2], []);
    byRow.get(p[2]).push(p);
    byIndex.set(p[0], p);
  });
  const auxPos = new Map(D.auxiliaries.map(([id], i) => [id, i]));
  const publicAt = new Map(D.publicBindings.map(([j, w, r, c]) => [r * W + c, j]));
  const usedRows = [...new Set([...byRow.keys(), ...D.publicBindings.map((b) => b[2])])].sort((a, b) => a - b);
  const lastUsed = usedRows.length ? usedRows[usedRows.length - 1] : 0;
  const byName = new Map();
  for (const w of cellsOf.keys()) byName.set(wireName(w), w);
  const value = (cell) => (hasValues ? String(D.values[cell]) : "");
  const placementName = (index) => (index < nAux ? `${wireName(D.auxiliaries[index][0])} defined` : `equation ${index - nAux}`);
  const placementText = (index) => {
    if (index < nAux) { const [id, terms] = D.auxiliaries[index]; return `${wireName(id)} = ${lc(terms)}`; }
    return equation(D.rewritten[index - nAux]);
  };

  $("cards").innerHTML = [
    card(n(D.equations.length), "source equations"),
    card(n(nAux), "auxiliary wires added"),
    card(`${n(R)} × ${n(W)}`, "rows × columns"),
    card(`${Math.round((100 * used) / (R * W))}%`, `cells used (${n(used)})`),
    card(n(D.gates.length), `gates, of ${n(D.gateTypes)} types`),
    card(n(D.selectors), "selector columns"),
    card(n(copied), "signals in several cells"),
    card(n(D.publicBindings.length), "public values"),
  ].join("");

  $("content").innerHTML = `
    <h2 id="trace">Trace</h2>
    <p class="legend">One box per cell, coloured by the gate (constraint) that covers it.
      ${lastUsed + 1 < R ? `Rows ${lastUsed + 1}–${R - 1}, below the line, are padding: the row count is a power of two.` : ""}
      A dot marks a public value. Hover a cell for details; click it, or search a signal, to select the signal:
      the numbered line through its cells is the cycle along which the permutation argument makes them equal.</p>
    <div class="bar">
      <input type="search" id="find" list="names" placeholder="Find a signal, e.g. ${esc(wireName(D.cells.find((w) => w) || 1))}">
      <datalist id="names">${[...byName.keys()].slice(0, 5000).map((s) => `<option value="${esc(s)}">`).join("")}</datalist>
      <span class="grow"></span>
      ${hasValues ? `<button id="values" class="on" title="Show the witness value of each cell">Values</button>` : ""}
      <button id="mode"></button>
      <button id="zoomOut" title="Smaller cells">−</button><span class="legend" id="zoomLabel"></span><button id="zoomIn" title="Larger cells">+</button>
    </div>
    <div class="grid-wrap" id="wrap"><canvas id="grid"></canvas></div>
    <p class="legend" style="margin-top:6px"><span class="swatch" style="background:var(--select)"></span>selected signal and its copy cycle
      <span class="swatch" style="background:var(--accent);margin-left:12px"></span>selected equation or gate</p>
    <div class="panel" id="wire">Click a cell or search a signal to see where it is used.</div>

    <h2 id="equations">Equations</h2>
    <p class="legend">How one source equation is compiled: when it uses more than <code>width</code> signals it is rewritten with
      auxiliary wires, each defined by its own equation; then every part is placed on one row, where a gate enforces it.</p>
    <div class="bar"><button id="prev">←</button><input type="number" id="pick" min="0" max="${D.equations.length - 1}" value="0"><button id="next">→</button><span class="legend" id="count"></span></div>
    <div id="flow"></div>
    <div id="explain"></div>

    <h2 id="rows">Rows</h2>
    <p class="legend">What each row holds: the equations placed on it, written with signal names, and the signal in each cell${hasValues ? " with its value" : ""}.</p>
    <div class="bar"><button id="rowsPrev">←</button><span class="legend" id="rowsLabel"></span><button id="rowsNext">→</button>
      <span class="grow"></span><span class="legend">Go to row</span><input type="number" id="rowGo" min="0" max="${R - 1}"></div>
    <div class="panel" style="padding:0;max-height:70vh;overflow:auto"><table id="rowsTable"></table></div>

    <div class="two">
      <div><h2 id="gates">Gates</h2><p class="legend">A gate is a gate type on fixed columns, active on the rows its selector marks. Click one to outline its cells.</p>
        <div class="panel" style="max-height:420px;overflow:auto;padding:0"><table id="gatesTable"></table></div></div>
      <div><h2 id="copies">Most copied signals</h2><p class="legend">Signals in the most cells; each extra cell is a copy the permutation argument ties.</p>
        <div class="panel" style="max-height:420px;overflow:auto;padding:0"><table id="copiesTable"></table></div></div>
    </div>`;

  // ---- trace
  const canvas = $("grid"), ctx = canvas.getContext("2d"), wrap = $("wrap");
  const css = getComputedStyle(document.documentElement);
  const color = (v) => css.getPropertyValue(v).trim();
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const gateColor = (g) => `hsl(${(g * 137.508) % 360} 55% ${dark ? 40 : 72}%)`;
  // Gutters for row and column numbers. A canvas side may not exceed about
  // 32 000 pixels.
  const LEFT = 40, TOP = 18, LIMIT = 30000;
  const nameWidths = [72, 104, 150, 210].filter((w) => w * W + LEFT <= LIMIT);
  const nameHeight = hasValues ? 32 : 20;
  const canName = nameWidths.length > 0 && R * nameHeight + TOP <= LIMIT;
  const fitSquare = Math.floor((wrap.clientWidth - LEFT - 2) / W);
  const maxSquare = Math.max(2, Math.min(48, Math.floor((LIMIT - TOP) / R), Math.floor((LIMIT - LEFT) / W)));
  let square = Math.max(2, Math.min(maxSquare, 32, fitSquare));
  let nameStep = Math.min(1, nameWidths.length - 1);
  let names = canName && W * nameWidths[nameStep] + LEFT <= wrap.clientWidth;
  let showValues = hasValues;
  let cw = 0, ch = 0;
  let selectedWire = 0, highlighted = new Set();

  function resize() {
    [cw, ch] = names ? [nameWidths[nameStep], nameHeight] : [square, square];
    const dpr = window.devicePixelRatio || 1;
    const width = LEFT + W * cw, height = TOP + R * ch;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + "px"; canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    $("mode").textContent = names ? "Overview" : "Show names";
    $("mode").disabled = !canName;
    $("zoomLabel").textContent = names ? `${cw} px wide` : `${square} px`;
    $("zoomOut").disabled = names ? nameStep === 0 : square <= 2;
    $("zoomIn").disabled = names ? nameStep === nameWidths.length - 1 : square >= maxSquare;
    draw();
  }
  function fit(text, width) {
    if (width <= 4) return "";
    if (ctx.measureText(text).width <= width) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ctx.measureText(text.slice(0, mid) + "…").width <= width) lo = mid; else hi = mid - 1; }
    return lo ? text.slice(0, lo) + "…" : "";
  }
  const centre = (cell) => [LEFT + (cell % W) * cw + cw / 2, TOP + ((cell / W) | 0) * ch + ch / 2];
  function draw() {
    const width = LEFT + W * cw, height = TOP + R * ch;
    ctx.fillStyle = color("--panel"); ctx.fillRect(0, 0, width, height);
    const gap = ch >= 6 ? 1 : 0;
    const first = Math.max(0, Math.floor((wrap.scrollTop - TOP) / ch) - 2);
    const last = Math.min(R, Math.ceil((wrap.scrollTop + wrap.clientHeight) / ch) + 2);
    // Row and column numbers, as often as they fit.
    ctx.fillStyle = color("--muted"); ctx.font = "10px system-ui, sans-serif"; ctx.textBaseline = "middle";
    const rowStep = Math.max(1, Math.ceil(14 / ch)), colStep = Math.max(1, Math.ceil(24 / cw));
    ctx.textAlign = "right";
    for (let r = 0; r < R; r += rowStep) ctx.fillText(r, LEFT - 6, TOP + r * ch + ch / 2);
    ctx.textAlign = "center";
    for (let c = 0; c < W; c += colStep) ctx.fillText(c, LEFT + c * cw + cw / 2, TOP / 2);
    ctx.textAlign = "left";
    const mono = "11.5px ui-monospace, Menlo, Consolas, monospace";
    for (let cell = 0; cell < R * W; cell++) {
      const r = (cell / W) | 0, c = cell % W, w = D.cells[cell], g = D.cellGate[cell];
      const x = LEFT + c * cw, y = TOP + r * ch;
      ctx.fillStyle = w ? (g >= 0 ? gateColor(g) : color("--muted")) : color("--empty");
      ctx.fillRect(x, y, cw - gap, ch - gap);
      const dot = publicAt.has(cell) && ch >= 4;
      if (dot) {
        ctx.fillStyle = color("--on-cell");
        ctx.beginPath(); ctx.arc(x + Math.max(3, Math.min(ch, cw) / 6), y + Math.min(ch / 2, 9), Math.max(1, Math.min(3, ch / 7)), 0, 7); ctx.fill();
      }
      if (!names && showValues && w && cw >= 18 && r >= first && r < last) {
        const text = value(cell);
        ctx.font = `${Math.min(12, cw / 2.2)}px ui-monospace, Menlo, monospace`;
        if (ctx.measureText(text).width <= cw - 4) {
          ctx.fillStyle = color("--on-cell"); ctx.textAlign = "center";
          ctx.fillText(text, x + cw / 2, y + ch / 2 + 1); ctx.textAlign = "left";
        }
      }
      if (names && w && r >= first && r < last) {
        const left = dot ? 10 : 4;
        ctx.fillStyle = color("--on-cell"); ctx.font = mono;
        if (showValues) {
          ctx.fillText(fit(wireName(w), cw - left - 3), x + left, y + 9);
          ctx.globalAlpha = 0.65; ctx.fillText(fit("= " + value(cell), cw - 7), x + 4, y + 23); ctx.globalAlpha = 1;
        } else {
          ctx.fillText(fit(wireName(w), cw - left - 3), x + left, y + ch / 2);
        }
      }
    }
    if (lastUsed + 1 < R) {
      ctx.fillStyle = color("--muted");
      ctx.fillRect(LEFT, TOP + (lastUsed + 1) * ch - 1, W * cw, 1);
    }
    const outline = (cells, style) => {
      ctx.strokeStyle = style; ctx.lineWidth = Math.max(1.5, Math.min(3, ch / 6));
      for (const cell of cells) {
        const x = LEFT + (cell % W) * cw, y = TOP + ((cell / W) | 0) * ch;
        ctx.strokeRect(x + 1, y + 1, cw - 2 - gap, ch - 2 - gap);
      }
    };
    outline(highlighted, color("--accent"));
    if (selectedWire) drawCycle(cellsOf.get(selectedWire) || [], outline);
  }
  // The copy cycle of a signal: each cell links to its next cell, in
  // row-major order, and the last back to the first (dashed), which is the
  // cycle of labels the permutation argument checks (SPEC.md).
  function drawCycle(cells, outline) {
    outline(cells, color("--select"));
    if (cells.length < 2) return;
    const red = color("--select");
    ctx.strokeStyle = red; ctx.fillStyle = red; ctx.lineWidth = 2; ctx.globalAlpha = 0.75;
    const radius = Math.max(5, Math.min(9, Math.min(cw, ch) / 2 - 1));
    for (let i = 0; i < cells.length; i++) {
      const closing = i === cells.length - 1;
      const [x1, y1] = centre(cells[i]), [x2, y2] = centre(cells[(i + 1) % cells.length]);
      // Bend each link sideways so that links between the same columns stay apart.
      const bend = Math.min(80, 14 + Math.hypot(x2 - x1, y2 - y1) / 5);
      const length = Math.hypot(x2 - x1, y2 - y1) || 1;
      const cx = (x1 + x2) / 2 + (bend * (y2 - y1)) / length, cy = (y1 + y2) / 2 - (bend * (x2 - x1)) / length;
      ctx.setLineDash(closing ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
      ctx.setLineDash([]);
      const angle = Math.atan2(y2 - cy, x2 - cx), tipX = x2 - radius * Math.cos(angle), tipY = y2 - radius * Math.sin(angle);
      ctx.beginPath(); ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX - 10 * Math.cos(angle - 0.45), tipY - 10 * Math.sin(angle - 0.45));
      ctx.lineTo(tipX - 10 * Math.cos(angle + 0.45), tipY - 10 * Math.sin(angle + 0.45));
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "bold 10px system-ui, sans-serif"; ctx.textAlign = "center";
    cells.forEach((cell, i) => {
      const [x, y] = centre(cell);
      ctx.fillStyle = red; ctx.beginPath(); ctx.arc(x, y, radius, 0, 7); ctx.fill();
      if (radius >= 7) { ctx.fillStyle = "#fff"; ctx.fillText(i + 1, x, y + 0.5); }
    });
    ctx.textAlign = "left";
  }
  let pending = false;
  wrap.onscroll = () => { if (names && !pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); } };
  const scrollGridTo = (cell) => {
    wrap.scrollTop = Math.max(0, TOP + ((cell / W) | 0) * ch - wrap.clientHeight / 3);
    wrap.scrollLeft = Math.max(0, LEFT + (cell % W) * cw - wrap.clientWidth / 3);
    draw();
  };
  $("mode").onclick = () => { names = !names; resize(); };
  if (hasValues) $("values").onclick = () => { showValues = !showValues; $("values").classList.toggle("on", showValues); draw(); renderRows(); };
  $("zoomIn").onclick = () => {
    if (names) nameStep = Math.min(nameWidths.length - 1, nameStep + 1);
    else square = Math.min(maxSquare, Math.max(square + 1, Math.round(square * 1.5)));
    resize();
  };
  $("zoomOut").onclick = () => {
    if (names) nameStep = Math.max(0, nameStep - 1);
    else square = Math.max(2, Math.min(square - 1, Math.round(square / 1.5)));
    resize();
  };

  const at = (event) => {
    const box = canvas.getBoundingClientRect();
    const c = Math.floor((event.clientX - box.left - LEFT) / cw), r = Math.floor((event.clientY - box.top - TOP) / ch);
    return r >= 0 && r < R && c >= 0 && c < W ? r * W + c : -1;
  };
  const usesOf = (cell) => {
    const r = (cell / W) | 0, c = cell % W;
    return (byRow.get(r) || []).filter((p) => p[3].includes(c));
  };
  canvas.onmousemove = (event) => {
    const cell = at(event), tip = $("tip");
    if (cell < 0) { tip.style.display = "none"; return; }
    const w = D.cells[cell], r = (cell / W) | 0, c = cell % W;
    const uses = usesOf(cell).map((p) => `${esc(placementName(p[0]))}: <span class="mono">${esc(placementText(p[0]))}</span>`);
    const pub = publicAt.has(cell) ? ` · public value ${publicAt.get(cell)}` : "";
    tip.innerHTML = `row ${r}, column ${c}` + (w
      ? `<br><b class="mono">${esc(wireName(w))}</b>${hasValues ? ` = <span class="mono">${esc(value(cell))}</span>` : ""} · ${cellsOf.get(w).length} cell(s)${pub}<br>${uses.join("<br>")}`
      : (r > lastUsed ? "<br>padding row" : "<br>unused"));
    tip.style.display = "block";
    tip.style.left = Math.min(event.clientX + 14, innerWidth - 470) + "px";
    tip.style.top = event.clientY + 14 + "px";
  };
  canvas.onmouseleave = () => { $("tip").style.display = "none"; };
  canvas.onclick = (event) => {
    const cell = at(event);
    if (cell >= 0 && D.cells[cell]) { selectWire(D.cells[cell]); showRows(rowIndexOf((cell / W) | 0)); }
  };
  $("find").onchange = () => {
    const query = $("find").value.trim();
    const w = byName.get(query) ?? (/^\d+$/.test(query) ? +query : undefined);
    if (w && cellsOf.has(w)) { selectWire(w); scrollGridTo(cellsOf.get(w)[0]); showRows(rowIndexOf((cellsOf.get(w)[0] / W) | 0)); }
  };

  function selectWire(w) {
    selectedWire = w;
    const cells = cellsOf.get(w) || [];
    const placements = new Map();
    for (const cell of cells) for (const p of usesOf(cell)) placements.set(p[0], p);
    const list = [...placements.values()].sort((a, b) => a[0] - b[0]).map((p) => {
      const name = p[0] >= nAux ? `<a data-eq="${p[0] - nAux}">${placementName(p[0])}</a>` : esc(placementName(p[0]));
      return `<div class="placed">${name}, row ${p[2]}: <span class="mono">${esc(placementText(p[0]))}</span></div>`;
    }).join("");
    const val = hasValues && cells.length ? ` = <span class="mono">${esc(value(cells[0]))}</span>` : "";
    $("wire").innerHTML = `<b class="mono">${esc(wireName(w))}</b>${val} <span class="legend">(wire ${w})</span> is in ${cells.length} cell(s)`
      + `${cells.length > 1 ? ", numbered along its copy cycle" : ""}: `
      + `<span class="mono">${cells.slice(0, 40).map((cell, i) => `${cells.length > 1 ? i + 1 + ":" : ""}(${(cell / W) | 0}, ${cell % W})`).join("  ")}${cells.length > 40 ? " …" : ""}</span>`
      + `<div class="label" style="margin-top:8px">Used by</div>${list || "<div class='legend'>no equation (a public value only)</div>"}`;
    $("wire").querySelectorAll("a[data-eq]").forEach((a) => { a.onclick = () => show(+a.dataset.eq); });
    draw();
    renderRows();
  }

  // ---- rows
  const PAGE = 40;
  let rowStart = 0, highlightedRows = new Set();
  const rowIndexOf = (row) => { const i = usedRows.findIndex((r) => r >= row); return i < 0 ? usedRows.length - 1 : i; };
  function showRows(index) { rowStart = Math.max(0, Math.min(usedRows.length - 1, index)); renderRows(); }
  function renderRows() {
    const slice = usedRows.slice(rowStart, rowStart + PAGE);
    $("rowsLabel").textContent = `rows ${slice[0] ?? 0}–${slice[slice.length - 1] ?? 0} (${rowStart + 1}–${rowStart + slice.length} of ${n(usedRows.length)} used rows)`;
    $("rowsPrev").disabled = rowStart === 0; $("rowsNext").disabled = rowStart + PAGE >= usedRows.length;
    $("rowsTable").innerHTML = `<tr><th>Row</th><th>Equations placed</th><th>Cells (column, signal${hasValues && showValues ? ", value" : ""})</th></tr>` + slice.map((r) => {
      const placed = (byRow.get(r) || []).map((p) => {
        const name = p[0] >= nAux ? `<a data-eq="${p[0] - nAux}">${placementName(p[0])}</a>` : esc(placementName(p[0]));
        return `<div class="placed"><span class="swatch" style="background:${gateColor(p[1])}"></span>${name}: <span class="mono">${esc(placementText(p[0]))}</span></div>`;
      }).join("");
      const chips = [];
      for (let c = 0; c < W; c++) {
        const cell = r * W + c, w = D.cells[cell];
        if (!w) continue;
        const g = D.cellGate[cell];
        const pub = publicAt.has(cell) ? " ●" : "";
        const val = hasValues && showValues ? `<span class="val">= ${esc(value(cell))}</span>` : "";
        chips.push(`<span class="chip mono${w === selectedWire ? " on" : ""}" data-wire="${w}" style="border-left-color:${g >= 0 ? gateColor(g) : "var(--muted)"}"><span class="col">${c}</span>${esc(wireName(w))}${pub}${val}</span>`);
      }
      return `<tr${highlightedRows.has(r) ? ' class="focus"' : ""}><td class="mono">${r}</td><td>${placed || "<span class='legend'>public value cells only</span>"}</td><td>${chips.join("")}</td></tr>`;
    }).join("");
    $("rowsTable").querySelectorAll("a[data-eq]").forEach((a) => { a.onclick = () => show(+a.dataset.eq); });
    $("rowsTable").querySelectorAll(".chip").forEach((chip) => { chip.onclick = () => selectWire(+chip.dataset.wire); });
  }
  $("rowsPrev").onclick = () => showRows(rowStart - PAGE);
  $("rowsNext").onclick = () => showRows(rowStart + PAGE);
  $("rowGo").onchange = () => showRows(rowIndexOf(+$("rowGo").value));

  // ---- equations
  // The auxiliary wires an equation uses, each followed by those its own
  // definition uses, depth first.
  function auxTree(sides) {
    const seen = new Set(), order = [];
    const visit = (terms, parent, depth) => {
      for (const [w] of terms) {
        if (w < D.originalWires || seen.has(w)) continue;
        seen.add(w);
        order.push({ id: w, parent, depth });
        visit(D.auxiliaries[auxPos.get(w)][1], w, depth + 1);
      }
    };
    for (const side of sides) visit(side, null, 0);
    return order;
  }
  // Text broken into lines of at most `width` characters, at most `max` lines.
  function lines(text, width, max) {
    const out = [];
    let rest = text;
    while (rest.length && out.length < max) {
      if (rest.length <= width) { out.push(rest); rest = ""; break; }
      let cut = rest.lastIndexOf(" ", width);
      if (cut < width / 2) cut = width;
      out.push(rest.slice(0, cut)); rest = rest.slice(cut).trimStart();
    }
    if (rest.length) out[out.length - 1] = out[out.length - 1].slice(0, Math.max(0, width - 1)) + "…";
    return out;
  }
  function flow(i, nodes, own, same) {
    const width = Math.max(900, $("flow").clientWidth || 1200);
    const colA = 2, wA = Math.floor(width * 0.28), colB = colA + wA + 44, wB = Math.floor(width * 0.4), colC = colB + wB + 44, wC = width - colC - 2;
    const perChar = 7.25, charsA = Math.floor((wA - 20) / perChar), charsB = Math.floor((wB - 20) / perChar);
    const shown = nodes.slice(0, 24);
    const parts = [{ title: same ? "PLACED AS IT IS" : "REWRITTEN WITH AUXILIARY WIRES", text: equation(D.rewritten[i]), placement: own, depth: 0, id: null }]
      .concat(shown.map((node) => ({ title: "AUXILIARY WIRE", name: wireName(node.id), text: `${wireName(node.id)} = ${lc(D.auxiliaries[auxPos.get(node.id)][1], wireName, 12)}`,
        placement: byIndex.get(auxPos.get(node.id)), depth: node.depth + 1, id: node.id, parent: node.parent })));
    const svg = [];
    const box = (x, top, w, h, stroke) => `<rect class="box" x="${x}" y="${top}" width="${w}" height="${h}" rx="6"${stroke ? ` style="stroke:${stroke};stroke-width:2"` : ""}/>`;
    const text = (x, top, rows) => rows.map((row, k) => `<text x="${x}" y="${top + k * 16}">${esc(row)}</text>`).join("");
    const arrow = (x2, y2) => `<path class="head" d="M${x2},${y2} l-8,-4.5 v9 z"/>`;
    const curve = (x1, y1, x2, y2) => { const m = (x1 + x2) / 2; return `<path class="edge" d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2 - 7},${y2}"/>${arrow(x2, y2)}`; };
    svg.push(`<text class="title" x="${colA}" y="14">SOURCE EQUATION</text>`
      + `<text class="title" x="${colB}" y="14">${nodes.length ? `PARTS: THE EQUATION AND ${nodes.length} AUXILIARY WIRE${nodes.length > 1 ? "S" : ""}` : "PART"}</text>`
      + `<text class="title" x="${colC}" y="14">WHERE EACH PART IS PLACED</text>`);
    let y = 26;
    const centres = new Map();
    for (const part of parts) {
      const indent = Math.min(part.depth, 4) * 20;
      const body = lines(part.text, charsB - Math.ceil(indent / perChar), part.id === null ? 6 : 3);
      const p = part.placement, g = p ? gateColor(p[1]) : null;
      const h = Math.max(26 + body.length * 16, p ? 58 : 0);
      const x = colB + indent, w = wB - indent;
      svg.push(box(x, y, w, h, g));
      svg.push(`<text class="title" x="${x + 10}" y="${y + 16}">${part.title}${part.name ? ` <tspan style="font:600 11.5px ui-monospace,Menlo,monospace;fill:var(--text);letter-spacing:0">${esc(part.name)}</tspan>` : ""}</text>`);
      svg.push(text(x + 10, y + 34, body));
      centres.set(part.id, [x, y + h / 2, x + w, y + h]);
      if (p) {
        const strip = Math.max(2, Math.min(12, Math.floor((wC - 20) / W)));
        svg.push(box(colC, y, wC, h, g));
        svg.push(`<a data-row="${p[2]}"><text x="${colC + 10}" y="${y + 18}">row ${p[2]}</text></a>`
          + `<text x="${colC + 70}" y="${y + 18}" style="fill:var(--muted)">gate ${p[1]} · columns ${esc(p[3].length > 8 ? p[3].slice(0, 8).join(",") + ",…" : p[3].join(","))}</text>`);
        for (let c = 0; c < W; c++) {
          const on = p[3].includes(c);
          svg.push(`<rect x="${colC + 10 + c * strip}" y="${y + 28}" width="${Math.max(1, strip - 1)}" height="14" rx="2" style="fill:${on ? g : "var(--empty)"}"/>`);
        }
        svg.push(curve(x + w, y + h / 2, colC, y + h / 2));
      }
      y += h + 12;
    }
    if (nodes.length > shown.length) { svg.push(`<text class="title" x="${colB}" y="${y + 6}">… AND ${nodes.length - shown.length} MORE AUXILIARY WIRES</text>`); y += 20; }
    // The source equation, linked to the equation part.
    const source = lines(equation(D.equations[i], wireName), charsA, 16);
    const hA = 26 + source.length * 16;
    svg.push(box(colA, 26, wA, hA));
    svg.push(`<text class="title" x="${colA + 10}" y="42">EQUATION ${i}</text>`);
    svg.push(text(colA + 10, 60, source));
    const [bx, by] = centres.get(null);
    svg.push(curve(colA + wA, 26 + Math.min(hA / 2, 34), bx, by));
    // Each part links to the auxiliary wires it uses.
    for (const part of parts.slice(1)) {
      const from = centres.get(part.parent ?? null), to = centres.get(part.id);
      if (!from || !to) continue;
      svg.push(`<path class="edge" d="M${from[0] + 10},${from[3]} V${to[1]} H${to[0] - 7}"/>${arrow(to[0], to[1])}`);
    }
    const height = Math.max(y, 26 + hA + 12);
    $("flow").innerHTML = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${svg.join("")}</svg>`;
    $("flow").querySelectorAll("a[data-row]").forEach((a) => {
      a.onclick = () => { const r = +a.dataset.row; scrollGridTo(r * W); showRows(rowIndexOf(r)); };
    });
  }
  function show(i, follow = true) {
    i = Math.max(0, Math.min(D.equations.length - 1, i | 0));
    $("pick").value = i;
    $("count").textContent = `of ${n(D.equations.length)}`;
    const rewritten = D.rewritten[i];
    const nodes = auxTree(rewritten);
    const own = byIndex.get(nAux + i);
    const parts = [own, ...nodes.map((node) => byIndex.get(auxPos.get(node.id)))].filter(Boolean);
    highlighted = follow ? new Set(parts.flatMap((p) => p[3].map((c) => p[2] * W + c))) : new Set();
    highlightedRows = follow ? new Set(parts.map((p) => p[2])) : new Set();
    const same = JSON.stringify(rewritten) === JSON.stringify(D.equations[i]);
    flow(i, nodes, own, same);
    $("explain").innerHTML = same ? "" : `<div class="label">Rewritten equation, in full</div><div class="eq">${esc(equation(rewritten, wireName))}</div>`;
    draw();
    if (own && follow) { scrollGridTo(own[2] * W + own[3][0]); showRows(rowIndexOf(own[2])); } else renderRows();
  }
  $("prev").onclick = () => show(+$("pick").value - 1);
  $("next").onclick = () => show(+$("pick").value + 1);
  $("pick").onchange = () => show(+$("pick").value);

  // ---- gates and copies
  $("gatesTable").innerHTML = `<tr><th>Gate</th><th>Type (signals)</th><th>Columns</th><th>Rows</th><th>Selector</th></tr>`
    + D.gates.map(([type, width, cols, count, first, selector], g) =>
      `<tr class="click" data-gate="${g}"><td><span class="swatch" style="background:${gateColor(g)}"></span>${g}</td><td>${type} (${width})</td>`
      + `<td class="mono">${cols.length > 6 ? cols.slice(0, 6).join(", ") + ", …" : cols.join(", ")}</td><td>${n(count)} from row ${first}</td><td class="mono">E${selector}</td></tr>`).join("");
  $("gatesTable").querySelectorAll("tr[data-gate]").forEach((tr) => {
    tr.onclick = () => {
      const g = +tr.dataset.gate;
      highlighted = new Set();
      D.cellGate.forEach((x, cell) => { if (x === g) highlighted.add(cell); });
      highlightedRows = new Set([...highlighted].map((cell) => (cell / W) | 0));
      const first = [...highlighted][0] || 0;
      scrollGridTo(first); showRows(rowIndexOf((first / W) | 0));
    };
  });
  const top = [...cellsOf.entries()].filter(([, c]) => c.length > 1).sort((a, b) => b[1].length - a[1].length).slice(0, 50);
  $("copiesTable").innerHTML = `<tr><th>Signal</th><th>Cells</th></tr>` + (top.length
    ? top.map(([w, c]) => `<tr class="click" data-wire="${w}"><td class="mono">${esc(wireName(w))}</td><td>${c.length}</td></tr>`).join("")
    : `<tr><td colspan="2">Every signal has one cell, so there is no permutation argument.</td></tr>`);
  $("copiesTable").querySelectorAll("tr[data-wire]").forEach((tr) => {
    tr.onclick = () => { const w = +tr.dataset.wire; selectWire(w); scrollGridTo(cellsOf.get(w)[0]); showRows(rowIndexOf((cellsOf.get(w)[0] / W) | 0)); };
  });

  // An address ending in #equation=N, #signal=NAME or #view=names (or
  // overview) opens with that equation, signal or view.
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("view") === "names" && canName) names = true;
  if (hash.get("view") === "overview") names = false;
  resize();
  show(hash.has("equation") ? +hash.get("equation") : 0, hash.has("equation"));
  if (hash.has("signal") && byName.has(hash.get("signal"))) {
    const w = byName.get(hash.get("signal"));
    selectWire(w); scrollGridTo(cellsOf.get(w)[0]);
  }
  if (hash.has("section")) $(hash.get("section"))?.scrollIntoView();
}
</script>
</body>
</html>
